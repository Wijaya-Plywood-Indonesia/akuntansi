name: Akuntansi CI/CD

on:
  push:
    branches: ["main", "develop"]
  create:
    tags: ["v*"]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: TESTING (CI)
  # ──────────────────────────────────────────────
  laravel-tests:
    name: 🧪 Run Tests (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: laravel_testing
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, zip, gd, intl
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: 📋 Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 🔧 Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: 🔑 Generate App Key
        run: php artisan key:generate

      - name: 🔐 Set Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: ⏳ Wait for MariaDB to be fully ready
        run: |
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SELECT 1;" laravel_testing > /dev/null 2>&1; then
              echo "✅ MariaDB is ready and accepting queries! (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 3s..."
            sleep 3
          done
          echo "❌ MariaDB did not become ready in time!"
          exit 1

      - name: ✅ Run Fresh Migration
        run: php artisan migrate:fresh --force --no-interaction

      - name: ✅ Verify No Pending Migrations
        run: |
          STATUS=$(php artisan migrate:status --no-ansi 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Pending"; then
            echo "❌ Ada migration yang pending!"
            exit 1
          fi
          echo "✅ Semua migration sudah berjalan."

  deploy-production:
    name: Deploy to akuntansi.wijayaplywoods.com
    needs: laravel-tests
    # HANYA jalan jika kamu membuat TAG (misal v1.0)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # Aktifkan Manual Approval di Settings > Environments

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP & Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Composer Prod
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Create Deployment Package
        run: |
          set -euo pipefail
          BUILD_DIR=./build_deploy
          mkdir -p "$BUILD_DIR"
          
          # rsync memilah file, abaikan storage dan .env agar data aman
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude '.env' \
            --exclude 'storage/' \
            ./ "$BUILD_DIR/"
            
          (cd "$BUILD_DIR" && zip -r ../deploy.zip . -q)

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "/home/${{ secrets.SSH_USERNAME }}"

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            TARGET_DIR="/home/${{ secrets.SSH_USERNAME }}/akuntansi.wijayaplywoods.com"
            cd "$TARGET_DIR"
            
            # 🛡️ Safety net: apapun hasil script ini, situs WAJIB balik online di akhir.
            trap 'EXIT_CODE=$?; php artisan up || true; if [ $EXIT_CODE -ne 0 ]; then echo "❌ Deploy GAGAL, exit code: $EXIT_CODE — cek manual!"; fi' EXIT
            
            php artisan down || true
            
            find . -mindepth 1 -maxdepth 1 ! -name 'storage' ! -name '.env' -exec rm -rf {} \;
            
            unzip -oq ../deploy.zip -d .
            echo "✅ Unzip selesai tanpa error"
            
            php artisan optimize:clear
            
            # Symlink — pakai TARGET_DIR, konsisten dgn deklarasi di atas
            cd "$TARGET_DIR/public"
            if [ ! -e "storage" ]; then
              ln -s "$TARGET_DIR/storage/app/public" storage
            fi
            cd "$TARGET_DIR"
            
            php artisan filament:assets
            
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # php artisan migrate --force
            
            php artisan shield:generate --all --panel=admin --no-interaction
            
            chmod -R 775 storage bootstrap/cache
            
            rm -f ../deploy.zip
            echo "🚀 Deployment Akuntansi Sukses!"
