name: Deploy Akuntansi

on:
  push:
    branches: [staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch atau tag yang di-deploy'
        required: true
        default: staging

concurrency:
  group: deploy-akuntansi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tentukan ref
        id: r
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy ke server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: akuntansi
          GIT_REF: ${{ steps.r.outputs.ref }}
          APP_SERVICE: app
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DIR,GIT_REF,APP_SERVICE
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/apps/$APP_DIR"

            git fetch --all --tags --prune
            if git show-ref --verify --quiet "refs/remotes/origin/$GIT_REF"; then
              git checkout "$GIT_REF"
              git reset --hard "origin/$GIT_REF"
            else
              git checkout "tags/$GIT_REF"
            fi

            run() { docker compose exec -T "$APP_SERVICE" "$@"; }

            run composer install --no-dev --optimize-autoloader --no-interaction
            run php artisan migrate --force
            run php artisan route:clear

            # shield:generate hanya dijalankan kalau paketnya ada
            if run php artisan list --raw | grep -q '^shield:generate'; then
              run php artisan shield:generate --all --panel=admin   # sesuaikan ID panel
            fi

            run php artisan optimize
            run php artisan queue:restart

            echo "Deploy $APP_DIR ($GIT_REF) selesai"

  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
