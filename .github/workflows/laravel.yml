name: Akuntansi CI/CD

on:
  push:
    branches: ["main", "develop"]
  create:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Pilih target deploy"
        required: true
        default: "prarelease"
        type: choice
        options:
          - testing_only
          - prarelease
          - production

concurrency:
  group: cicd-akuntansi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: TESTING (CI)
  # ──────────────────────────────────────────────
  laravel-tests:
    name: 🧪 Run Tests (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: laravel_testing
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, zip, gd, intl
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: 📋 Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 🔧 Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: 🔑 Generate App Key
        run: php artisan key:generate

      - name: 🔐 Set Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: ⏳ Wait for MariaDB to be fully ready
        run: |
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SELECT 1;" laravel_testing > /dev/null 2>&1; then
              echo "✅ MariaDB is ready and accepting queries! (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 3s..."
            sleep 3
          done
          echo "❌ MariaDB did not become ready in time!"
          exit 1

      - name: ✅ Run Fresh Migration
        run: php artisan migrate:fresh --force --no-interaction

      - name: ✅ Verify No Pending Migrations
        run: |
          STATUS=$(php artisan migrate:status --no-ansi 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Pending"; then
            echo "❌ Ada migration yang pending!"
            exit 1
          fi
          echo "✅ Semua migration sudah berjalan."

  # ──────────────────────────────────────────────
  # JOB 2: DEPLOY PRARELEASE
  # ──────────────────────────────────────────────
  deploy-prarelease:
    name: "Deploy to prarelease-akuntansi.wijayaplywoods.com"
    needs: laravel-tests
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'prarelease')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prarelease-akuntansi
      cancel-in-progress: false
    env:
      ZIP_NAME: deploy-prarelease.zip
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - run: composer install --no-dev --optimize-autoloader --no-interaction

      - run: |
          npm ci
          npm run build

      - name: Create ZIP
        run: |
          set -euo pipefail
          BUILD_DIR=./build_deploy
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude 'tests/' --exclude '.env' --exclude 'storage/' \
            ./ "$BUILD_DIR/"
          (cd "$BUILD_DIR" && zip -r "../$ZIP_NAME" . -q)

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.ZIP_NAME }}"
          target: "/home/${{ secrets.SSH_USERNAME }}"

      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            TARGET="/home/${{ secrets.SSH_USERNAME }}/prarelease-akuntansi.wijayaplywoods.com"
            STAGING="/home/${{ secrets.SSH_USERNAME }}/_staging_prarelease-akuntansi.wijayaplywoods.com"
            ZIP_PATH="/home/${{ secrets.SSH_USERNAME }}/${{ env.ZIP_NAME }}"

            cd "$TARGET"
            trap 'EXIT_CODE=$?; php artisan up || true; if [ $EXIT_CODE -ne 0 ]; then echo "❌ Deploy GAGAL, exit code: $EXIT_CODE — situs kembali online tapi state mungkin tidak konsisten, cek manual!"; fi' EXIT
            [ -f "artisan" ] && php artisan down || true

            # 1. Unzip ke STAGING terpisah dulu — TARGET belum disentuh, jadi kalau unzip gagal, TARGET tetap utuh
            rm -rf "$STAGING" && mkdir -p "$STAGING"
            unzip -oq "$ZIP_PATH" -d "$STAGING"
            echo "✅ Unzip ke staging selesai tanpa error"

            # 2. Baru setelah unzip sukses, bersihkan TARGET (kecuali storage, .env, dan .github)
            find . -mindepth 1 -maxdepth 1 \
              ! -name 'storage' \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.github' \
              -exec rm -rf {} +

            # 3. Salin isi STAGING ke TARGET
            find "$STAGING" -mindepth 1 -maxdepth 1 \
              ! -name 'storage' \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.github' \
              -exec cp -r {} "$TARGET/" \;

            # database.sqlite hanya placeholder (tidak menyimpan data penting) — cukup pastikan filenya ada
            mkdir -p database
            touch database/database.sqlite

            # Pastikan struktur folder storage & cache lengkap, dan permission benar SEBELUM artisan dipanggil
            mkdir -p storage/framework/{sessions,views,cache/data}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache database

            php artisan optimize:clear

            (cd "$TARGET/public" && [ -e "storage" ] || ln -s "$TARGET/storage/app/public" storage)

            php artisan filament:assets
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan shield:generate --all --panel=admin --no-interaction

            rm -rf "$STAGING"
            rm -f "$ZIP_PATH"
            echo "🚀 [prarelease-akuntansi.wijayaplywoods.com] Deployment Sukses! [${{ github.sha }}]"

  # ──────────────────────────────────────────────
  # JOB 3: DEPLOY PRODUCTION
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to akuntansi.wijayaplywoods.com
    needs: laravel-tests
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production')
    runs-on: ubuntu-latest
    environment: production # Aktifkan Manual Approval di Settings > Environments
    concurrency:
      group: deploy-production-akuntansi
      cancel-in-progress: false
    env:
      ZIP_NAME: deploy.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP & Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Composer Prod
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Create Deployment Package
        run: |
          set -euo pipefail
          BUILD_DIR=./build_deploy
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"

          # rsync memilah file, abaikan storage dan .env agar data aman
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude '.env' \
            --exclude 'storage/' \
            ./ "$BUILD_DIR/"

          (cd "$BUILD_DIR" && zip -r "../$ZIP_NAME" . -q)

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.ZIP_NAME }}"
          target: "/home/${{ secrets.SSH_USERNAME }}"

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            TARGET_DIR="/home/${{ secrets.SSH_USERNAME }}/akuntansi.wijayaplywoods.com"
            STAGING="/home/${{ secrets.SSH_USERNAME }}/_staging_akuntansi.wijayaplywoods.com"
            ZIP_PATH="/home/${{ secrets.SSH_USERNAME }}/${{ env.ZIP_NAME }}"

            cd "$TARGET_DIR"
            # 🛡️ Safety net: apapun hasil script ini, situs WAJIB balik online di akhir.
            trap 'EXIT_CODE=$?; php artisan up || true; if [ $EXIT_CODE -ne 0 ]; then echo "❌ Deploy GAGAL, exit code: $EXIT_CODE — situs kembali online tapi state mungkin tidak konsisten, cek manual!"; fi' EXIT
            [ -f "artisan" ] && php artisan down || true

            # 1. Unzip ke STAGING terpisah dulu — TARGET_DIR belum disentuh, jadi kalau unzip gagal, TARGET_DIR tetap utuh
            rm -rf "$STAGING" && mkdir -p "$STAGING"
            unzip -oq "$ZIP_PATH" -d "$STAGING"
            echo "✅ Unzip ke staging selesai tanpa error"

            # 2. Baru setelah unzip sukses, bersihkan TARGET_DIR (kecuali storage, .env, dan .github)
            find . -mindepth 1 -maxdepth 1 \
              ! -name 'storage' \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.github' \
              -exec rm -rf {} +

            # 3. Salin isi STAGING ke TARGET_DIR
            find "$STAGING" -mindepth 1 -maxdepth 1 \
              ! -name 'storage' \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.github' \
              -exec cp -r {} "$TARGET_DIR/" \;

            # database.sqlite hanya placeholder (tidak menyimpan data penting) — cukup pastikan filenya ada
            mkdir -p database
            touch database/database.sqlite

            # Pastikan struktur folder storage & cache lengkap, dan permission benar SEBELUM artisan dipanggil
            mkdir -p storage/framework/{sessions,views,cache/data}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache database

            php artisan optimize:clear

            # Symlink — pakai TARGET_DIR, konsisten dgn deklarasi di atas
            (cd "$TARGET_DIR/public" && [ -e "storage" ] || ln -s "$TARGET_DIR/storage/app/public" storage)

            php artisan filament:assets

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            php artisan migrate --force

            php artisan shield:generate --all --panel=admin --no-interaction

            rm -rf "$STAGING"
            rm -f "$ZIP_PATH"
            echo "🚀 [akuntansi.wijayaplywoods.com] Deployment Sukses! [${{ github.ref_name }}]"
